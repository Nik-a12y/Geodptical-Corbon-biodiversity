services:
  db:
    image: postgis/postgis:16-3.4
    container_name: darukaa-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: darukaa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - darukaa_pgdata:/var/lib/postgresql/data

volumes:
  darukaa_pgdata:
